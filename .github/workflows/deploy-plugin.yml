name: Deploy Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-plugin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
          WP_REMOTE_PATH: ${{ secrets.WP_REMOTE_PATH }}
        run: |
          test -n "${WP_SSH_HOST}" || { echo "Missing WP_SSH_HOST"; exit 1; }
          test -n "${WP_SSH_PORT}" || { echo "Missing WP_SSH_PORT"; exit 1; }
          test -n "${WP_SSH_USER}" || { echo "Missing WP_SSH_USER"; exit 1; }
          test -n "${WP_SSH_PASSWORD}" || { echo "Missing WP_SSH_PASSWORD"; exit 1; }
          test -n "${WP_REMOTE_PATH}" || { echo "Missing WP_REMOTE_PATH"; exit 1; }

      - name: Deploy plugin over SFTP
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ secrets.WP_SSH_HOST }}
          port: ${{ secrets.WP_SSH_PORT }}
          username: ${{ secrets.WP_SSH_USER }}
          password: ${{ secrets.WP_SSH_PASSWORD }}
          uploads: |
            ./ => ${{ secrets.WP_REMOTE_PATH }}
          ignore: |
            .git
            .github
            .gitignore
            README.md
            *.zip
